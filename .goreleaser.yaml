version: 2

project_name: k8s-switch

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: k8s-switch
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/tuplle/k8s-switch/cmd.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE.txt
      - CHANGELOG.md

nfpms:
  - id: k8s-switch
    package_name: k8s-switch
    homepage: https://github.com/tuplle/k8s-switch
    description: >-
      A lightweight CLI tool to quickly switch between multiple Kubernetes
      configurations.
    maintainer: Milan Mladoniczky <6153201+tuplle@users.noreply.github.com>
    license: Apache-2.0
    section: utils
    bindir: /usr/bin
    formats:
      - rpm
      - deb

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: tuplle
    name: k8s-switch
